<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono-line {
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mono-wave {
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 2.5;
        stroke-linecap: round;
        opacity: 0.6;
      }
    </style>
    <filter id="mono-glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background (for demonstration) -->
  <rect width="512" height="512" fill="#0F1419"/>

  <!-- HEXAGON - Monochrome -->
  <polygon
    points="256,102 370,154 370,258 256,310 142,258 142,154"
    class="mono-line"
  />

  <!-- ENERGY WAVES - Monochrome -->
  <g id="waves-mono">
    <path d="M 280,140 Q 310,120 340,115" class="mono-wave"/>
    <path d="M 310,220 Q 350,230 375,235" class="mono-wave"/>
    <path d="M 300,295 Q 330,320 345,350" class="mono-wave"/>
    <path d="M 212,295 Q 182,320 167,350" class="mono-wave"/>
    <path d="M 202,220 Q 162,230 137,235" class="mono-wave"/>
    <path d="M 232,140 Q 202,120 172,115" class="mono-wave"/>
  </g>

  <!-- QUANTUM PARTICLE - Monochrome -->
  <g id="particle-mono" filter="url(#mono-glow)">
    <!-- Orbits -->
    <path d="M 240,220 Q 256,200 272,220" class="mono-line"/>
    <path d="M 295,230 Q 310,245 295,270" class="mono-line"/>
    <path d="M 272,285 Q 256,310 240,285" class="mono-line"/>
    <path d="M 217,270 Q 202,245 217,230" class="mono-line"/>

    <!-- Center cross -->
    <line x1="235" y1="235" x2="277" y2="277" class="mono-line"/>
    <line x1="277" y1="235" x2="235" y2="277" class="mono-line"/>
    <circle cx="256" cy="256" r="3" fill="#FFFFFF"/>
  </g>
</svg>
