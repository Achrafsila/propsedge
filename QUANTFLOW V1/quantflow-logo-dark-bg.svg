<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dark-bg-line {
        fill: none;
        stroke: #000000;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dark-bg-wave {
        fill: none;
        stroke: #000000;
        stroke-width: 2.5;
        stroke-linecap: round;
        opacity: 0.6;
      }
      .dark-bg-accent {
        fill: none;
        stroke: #000000;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- White/Light background (for light mode) -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- HEXAGON - Dark text -->
  <polygon
    points="256,102 370,154 370,258 256,310 142,258 142,154"
    class="dark-bg-line"
  />

  <!-- ENERGY WAVES - Dark -->
  <g id="waves-dark">
    <path d="M 280,140 Q 310,120 340,115" class="dark-bg-wave"/>
    <path d="M 310,220 Q 350,230 375,235" class="dark-bg-wave"/>
    <path d="M 300,295 Q 330,320 345,350" class="dark-bg-wave"/>
    <path d="M 212,295 Q 182,320 167,350" class="dark-bg-wave"/>
    <path d="M 202,220 Q 162,230 137,235" class="dark-bg-wave"/>
    <path d="M 232,140 Q 202,120 172,115" class="dark-bg-wave"/>
  </g>

  <!-- QUANTUM PARTICLE - Dark -->
  <g id="particle-dark">
    <!-- Orbits -->
    <path d="M 240,220 Q 256,200 272,220" class="dark-bg-line"/>
    <path d="M 295,230 Q 310,245 295,270" class="dark-bg-line"/>
    <path d="M 272,285 Q 256,310 240,285" class="dark-bg-line"/>
    <path d="M 217,270 Q 202,245 217,230" class="dark-bg-line"/>

    <!-- Center cross -->
    <line x1="235" y1="235" x2="277" y2="277" class="dark-bg-accent"/>
    <line x1="277" y1="235" x2="235" y2="277" class="dark-bg-accent"/>
    <circle cx="256" cy="256" r="3" fill="#000000"/>
  </g>

  <!-- Accent orbit -->
  <circle
    cx="256"
    cy="256"
    r="75"
    fill="none"
    stroke="#000000"
    stroke-width="1"
    stroke-dasharray="5,8"
    opacity="0.2"
  />
</svg>
